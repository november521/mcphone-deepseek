org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## 环境
#
# 这几个数刻意与 MCphone 本体【逐字相同】。附属编译用的 NeoForge 比本体新，
# 是最容易踩的一种坑：本体没用上的新 API，附属用上了，于是"装了本体就能用"
# 这句话在玩家那边不成立，而报错只会说某个方法找不到。
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248

# 运行时接受的 NeoForge 范围，与本体同一个值。
# 理由也和本体一样：升级开发环境不该把低版本玩家挡在门外。
neo_version_range=[21.1.200,)
loader_version_range=[1,)

## 模组
mod_id=mcphone_deepseek
mod_name=MCphone DeepSeek
mod_license=MIT

# 模组版本号。semver（https://semver.org/），三档在这个附属里各指什么：
#
#   大版本  破坏玩家已有的东西。这个 App 没有对外的接口，能破坏的只有两样：
#           config/mcphone_deepseek/conversations.json 的格式（对话记录）、
#           config.json 的格式（Key 与设置）。改到读不回旧文件就是大版本。
#   次版本  【一整套完备的功能】做完才升，补丁号归零。「多会话 + 历史 + 删除」
#           从无到有算一套；里头任何单独一步都不算。
#   补丁号  其余一切：修 bug、调布局、改美术、换图标、重构、改构建脚本、
#           跟着本体的新 API 走一步。
#
# 拿不准就升补丁号。版本号跳得比东西做出来的分量快，它就不再说明任何事情
# ——本体 gradle.properties 里那段把这个道理写得更细，规矩是一样的。
#
# 只动 README、docs/ 这类【不进 jar】的文件不升版本号。判断标准很硬：
# 跑一次 ./gradlew build，jar 里的字节变了没有。
#
# 1.0.1：换上正式的鲸鱼图标（进 jar，属于改美术）；修掉一批差一像素的
#        对齐问题（调布局）。两件都是补丁级，中间没有发过版，所以合成一次。
# 1.0.2：修聊天页滚动条方向反了（滑块和内容反着走，看上去像滚轮反了）；
#        修 Ui.circle 圆心被整数截断，圆偏半像素、最宽一行还超出直径；
#        重画发送键的箭头。三件都是修 bug。
mod_version=1.0.2
mod_group_id=com.november.mcphonedeepseek
mod_authors=november521

## MCphone 本体
#
# 编译对着 libs/ 里那个 jar，坐标不走 maven —— 本体目前没有公开 maven，
# docs/addon-api.md 里推荐的也是这条路。
#
# 这个版本号有两个用处：拼出 libs/ 下的文件名，以及写进 mods.toml 的
# versionRange 下限。两者【必须】是同一个数，否则会出现"编译对着新版、
# 运行时却宣称支持旧版"这种最难查的错配。
mcphone_version=1.8.18
