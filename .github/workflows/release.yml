name: Release

# 只在推 v* tag 时触发。build.yml 触发于 push 分支，两者不重叠、不会重复跑。
#
# 用不带前缀的 v<版本>：本体那边因为一个仓库装了多个加载器分支，才需要
# forge-v / neoforge-v 这类前缀来避免撞名（tag 在 git 里是【仓库级】的、
# 不属于任何分支）。这个附属仓库只有一支，没有那个问题。
on:
  push:
    tags:
      - 'v*'

# 默认的 GITHUB_TOKEN 是只读的，不显式提权就创建不了 Release。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # 【停在 v5，不要升 v6】，理由见 build.yml 里同名步骤。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 打了 v1.0.1 而 gradle.properties 还写着 1.0.0，是发版事故的常见来源：
      # jar 文件名、模组列表里的版本号会与 Release 标题对不上。宁可在这里失败。
      # 放在下载本体和编译【之前】，对不上就别浪费那几分钟。
      - name: Verify tag matches mod_version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "tag=$GITHUB_REF_NAME  mod_version=$MOD_VERSION"
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 gradle.properties 的 mod_version=$MOD_VERSION 不一致，请先对齐再发版"
            exit 1
          fi

      - name: Fetch MCphone
        uses: ./.github/actions/fetch-mcphone
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Gradle
        run: ./gradlew build

      # 声称支持 neo_version_range 的下限，就得证明代码没用上更新的 API，
      # 否则低版本玩家会在运行时撞上 NoSuchMethodError 而不是加载失败提示。
      #
      # 这条在附属里比在本体里更要紧：gradle.properties 把这几个版本号与
      # 本体逐字对齐了，而"本体没用上的新 API，附属用上了"正是最容易在
      # 玩家那边炸、在开发机上永远看不到的那类错配。
      - name: Verify minimum NeoForge version still compiles
        run: |
          MIN_NEO=$(grep -E '^neo_version_range=' gradle.properties \
            | sed -E 's/^neo_version_range=\[?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "declared minimum NeoForge: $MIN_NEO"
          ./gradlew compileJava -Pneo_version="$MIN_NEO"

      - name: Find built JAR
        id: find-jar
        run: |
          # 【按确切文件名取，不要 find | head -1】，理由见 build.yml 里同名步骤。
          # 这里更要紧：挑错就是把一个旧版本挂上 Release，玩家会真的下载。
          #
          # mod_version 已经在上面与 tag 校验过一致，直接拿它拼名字。
          MOD_ID=$(grep -E '^mod_id=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          JAR_PATH="build/libs/${MOD_ID}-${MOD_VERSION}.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::没找到 $JAR_PATH。build/libs 下现有："
            ls -la build/libs || true
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_path=$JAR_PATH"

      # 同名 tag 已有 Release 时先删掉，否则下面的 gh release create 会直接失败。
      # 语义是"重推 tag ＝ 重新出这个版本"：强推同名 tag 本身已是明确的破坏性
      # 动作，不会误触。只删与本次 tag 同名的那一个，不碰其他版本。
      - name: Remove pre-existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::$GITHUB_REF_NAME 已存在 Release，将删除后重建"
            gh release delete "$GITHUB_REF_NAME" --yes
          else
            echo "$GITHUB_REF_NAME 尚无 Release，直接创建"
          fi

      # 正文取自仓库内与 tag 同名的说明文件，让 Release 描述也进版本控制；
      # 没有对应文件时退回 GitHub 依据提交记录自动生成，不至于发出一个空描述。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAR_PATH: ${{ steps.find-jar.outputs.jar_path }}
        run: |
          # 标题从 mod_name 取，不写死。mod_name 有空格，所以只去掉行尾空白，
          # 不能像版本号那样 tr -d 全部空白。
          MOD_NAME=$(grep -E '^mod_name=' gradle.properties | cut -d= -f2- | sed -E 's/[[:space:]]+$//')
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          TITLE="${MOD_NAME} ${GITHUB_REF_NAME}"
          if [ -f "$NOTES_FILE" ]; then
            echo "使用 $NOTES_FILE 作为 Release 正文"
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "未找到 $NOTES_FILE，退回自动生成正文"
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" --title "$TITLE" --generate-notes
          fi

      # ---------------- 关于发布到 Modrinth / CurseForge ----------------
      #
      # 【故意没有这一段】。本体的 release.yml 里有，用 Kira-NT/mc-publish
      # 往两个平台发；照抄过来会用错项目：MODRINTH_ID 那个变量在本体仓库里
      # 指的是本体的项目（b6VR9Ywe），附属要发就得有自己的项目 ID 和令牌，
      # 而那个项目还没建。
      #
      # 真要加的时候：先在 Modrinth 上把附属项目建出来，再到
      #   仓库 → Settings → Secrets and variables → Actions
      #     Variables 页：MODRINTH_ID      （项目 ID，公开信息）
      #     Secrets 页：  MODRINTH_TOKEN   （令牌，绝不能进仓库）
      # 填好之后，把本体 release.yml 里 "Check publishing credentials" 起
      # 到结尾那几步搬过来即可——那边缺凭据是跳过并留 warning，不会让整次
      # 发版判失败，这个行为对附属同样合适。
      #
      # 附属还多一条本体没有的约束：它对本体是硬前置，Modrinth 上要把
      # MCphone 标成 required 依赖，否则玩家单独装它会直接崩在加载阶段。
