name: Release

# 只在推 v* tag 时触发。build.yml 触发于 push 分支，两者不重叠、不会重复跑。
#
# 用不带前缀的 v<版本>：本体那边因为一个仓库装了多个加载器分支，才需要
# forge-v / neoforge-v 这类前缀来避免撞名（tag 在 git 里是【仓库级】的、
# 不属于任何分支）。这个附属仓库只有一支，没有那个问题。
on:
  push:
    tags:
      - 'v*'

# 默认的 GITHUB_TOKEN 是只读的，不显式提权就创建不了 Release。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # 【停在 v5，不要升 v6】，理由见 build.yml 里同名步骤。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 打了 v1.0.1 而 gradle.properties 还写着 1.0.0，是发版事故的常见来源：
      # jar 文件名、模组列表里的版本号会与 Release 标题对不上。宁可在这里失败。
      # 放在下载本体和编译【之前】，对不上就别浪费那几分钟。
      - name: Verify tag matches mod_version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "tag=$GITHUB_REF_NAME  mod_version=$MOD_VERSION"
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 gradle.properties 的 mod_version=$MOD_VERSION 不一致，请先对齐再发版"
            exit 1
          fi

      - name: Fetch MCphone
        uses: ./.github/actions/fetch-mcphone
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Gradle
        run: ./gradlew build

      # 声称支持 neo_version_range 的下限，就得证明代码没用上更新的 API，
      # 否则低版本玩家会在运行时撞上 NoSuchMethodError 而不是加载失败提示。
      #
      # 这条在附属里比在本体里更要紧：gradle.properties 把这几个版本号与
      # 本体逐字对齐了，而"本体没用上的新 API，附属用上了"正是最容易在
      # 玩家那边炸、在开发机上永远看不到的那类错配。
      - name: Verify minimum NeoForge version still compiles
        run: |
          MIN_NEO=$(grep -E '^neo_version_range=' gradle.properties \
            | sed -E 's/^neo_version_range=\[?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "declared minimum NeoForge: $MIN_NEO"
          ./gradlew compileJava -Pneo_version="$MIN_NEO"

      - name: Find built JAR
        id: find-jar
        run: |
          # 【按确切文件名取，不要 find | head -1】，理由见 build.yml 里同名步骤。
          # 这里更要紧：挑错就是把一个旧版本挂上 Release，玩家会真的下载。
          #
          # mod_version 已经在上面与 tag 校验过一致，直接拿它拼名字。
          MOD_ID=$(grep -E '^mod_id=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          JAR_PATH="build/libs/${MOD_ID}-${MOD_VERSION}.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::没找到 $JAR_PATH。build/libs 下现有："
            ls -la build/libs || true
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_path=$JAR_PATH"

          # 下面几个给建 Release 和发布到 CurseForge 的步骤用。
          # 发布那步是 YAML 里的 with:，跑不了 shell，只能在这儿把值取出来。
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          # minecraft_version 不会误匹配 minecraft_version_range —— 正则要求
          # 名字后面紧跟等号。
          MC_VERSION=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          # mod_name 有空格，所以只去掉行尾空白，不能像版本号那样 tr -d 全部空白。
          MOD_NAME=$(grep -E '^mod_name=' gradle.properties | cut -d= -f2- | sed -E 's/[[:space:]]+$//')
          echo "mod_name=$MOD_NAME" >> "$GITHUB_OUTPUT"

      # 同名 tag 已有 Release 时先删掉，否则下面的 gh release create 会直接失败。
      # 语义是"重推 tag ＝ 重新出这个版本"：强推同名 tag 本身已是明确的破坏性
      # 动作，不会误触。只删与本次 tag 同名的那一个，不碰其他版本。
      - name: Remove pre-existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::$GITHUB_REF_NAME 已存在 Release，将删除后重建"
            gh release delete "$GITHUB_REF_NAME" --yes
          else
            echo "$GITHUB_REF_NAME 尚无 Release，直接创建"
          fi

      # 正文取自仓库内与 tag 同名的说明文件，让 Release 描述也进版本控制；
      # 没有对应文件时退回 GitHub 依据提交记录自动生成，不至于发出一个空描述。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAR_PATH: ${{ steps.find-jar.outputs.jar_path }}
          MOD_NAME: ${{ steps.find-jar.outputs.mod_name }}
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          TITLE="${MOD_NAME} ${GITHUB_REF_NAME}"
          if [ -f "$NOTES_FILE" ]; then
            echo "使用 $NOTES_FILE 作为 Release 正文"
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "未找到 $NOTES_FILE，退回自动生成正文"
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" --title "$TITLE" --generate-notes
          fi

      # ---------------- 发布到 CurseForge ----------------
      #
      # 用 Kira-NT/mc-publish，与本体同一个。作者改过名，网上大量教程写的还是
      # Kir-Antipov/mc-publish —— 那个地址目前靠 GitHub 的仓库重定向还能用，
      # 但重定向会在原名被别人注册时失效，所以这里写现在的名字。
      # 版本钉死在 v3.3.1 而不是 v3：v3 是会移动的 tag，作者一推新版，
      # 我们这边就在毫无改动的情况下换了行为。
      #
      # 【两个配置项都在 GitHub 网页上填，不改这个文件】：
      #   仓库 → Settings → Secrets and variables → Actions
      #     Variables 页：CURSEFORGE_ID     （项目 ID，公开信息）
      #     Secrets 页：  CURSEFORGE_TOKEN  （令牌，绝不能进仓库）
      #
      # 【CURSEFORGE_ID 必须是附属自己的项目 ID】。令牌是账号级的，与本体那个
      # 是同一个值，照抄没问题；项目 ID 不是 —— 填成本体的 1681807，附属的 jar
      # 会传到本体的项目下去。而这个错 check-publishing.yml 挡不住：它验的是
      # "这个 ID 存不存在"，本体的 ID 当然存在。
      - name: Check publishing credentials
        id: creds
        # 令牌只在这一步进环境，不挂到 job 级 env 上 —— 那样上面每一步
        # （包括 ./gradlew build 跑的一堆第三方插件）都能读到它。
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          # 缺凭据就跳过并留一条 warning，不让整次发版判失败：GitHub Release
          # 此时已经建好了，为一个还没配的令牌把它标成红叉，只会让人误以为
          # 发出去的包有问题。warning 在 Actions 页面上是黄色的一行，不至于
          # 悄没声地跳过。
          if [ -n "$CURSEFORGE_ID" ] && [ -n "$CURSEFORGE_TOKEN" ]; then
            echo "curseforge=true" >> "$GITHUB_OUTPUT"
          else
            echo "curseforge=false" >> "$GITHUB_OUTPUT"
            echo "::warning::跳过 CurseForge：变量 CURSEFORGE_ID 或密钥 CURSEFORGE_TOKEN 没配"
          fi

      - name: Prepare changelog for mod sites
        id: changelog
        if: steps.creds.outputs.curseforge == 'true'
        run: |
          # 上面建 Release 时没有说明文件可以退回 --generate-notes，
          # CurseForge 没有那个东西：changelog 留空，版本页就真的是一片空白。
          # 所以这里保证【总有一个文件】，最差也是一条指回 Release 的链接。
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="build/publish-changelog.md"
            echo "完整更新内容见 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" > "$NOTES_FILE"
            echo "::warning::未找到 docs/release-notes/${GITHUB_REF_NAME}.md，CurseForge 的更新日志只会有一条 Release 链接"
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        if: steps.creds.outputs.curseforge == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          # 【不传 github-token】：Release 上面已经用 gh 建好并挂好 jar 了，
          # 再让它插一手就是重复上传。这个输入没有默认值，不写即不发。
          #
          # 【按确切文件名传，不用它默认的 build/libs/*.jar 通配】——
          # 理由与 find-jar 那步同一个：挑错就是把旧版本发到平台上，
          # 而那边不像 GitHub，删了重发会留下痕迹、玩家可能已经下过。
          files: ${{ steps.find-jar.outputs.jar_path }}
          name: ${{ steps.find-jar.outputs.mod_name }} ${{ github.ref_name }}
          version: ${{ steps.find-jar.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.changelog.outputs.file }}
          loaders: neoforge
          game-versions: ${{ steps.find-jar.outputs.mc_version }}
          java: 21
          # 【刻意声明"没有依赖"】，空串就是这个意思（不写才是"从 jar 里读"）。
          #
          # 这一条在附属身上很别扭，得说清楚：本模组对 MCphone 是【硬前置】，
          # mods.toml 里写着 type="required"，玩家单独装它会崩在加载阶段。
          # 按理说 CurseForge 上就该标出这个依赖。
          #
          # 但不能从 jar 里自动读：CurseForge 是把 modId 原样当 slug 提交，
          # slug 在那边不存在就【整次上传失败】。我们的 modId 是 "mcphone"，
          # 而本体在 CurseForge 上的 slug 是不是也叫 mcphone，没有核实过——
          # 项目 ID 是 1681807，slug 得去项目页面上看。为一条依赖信息赌上
          # 整次发版不划算。
          #
          # 【所以依赖关系先在项目页面上手工建】：CurseForge 项目 →
          # Relations → 添加 MCphone，类型选 Required Dependency。那是一次性的
          # 设置，不随每次上传变。等确认了本体的 slug，再照 mc-publish 的语法
          # （id@version(type)，一行一条）填回这里，把手工那步换掉。
          dependencies: ''

      # ---------------- 关于 Modrinth ----------------
      #
      # 【故意还没有】。本体那边发两个平台，这里目前只接 CurseForge——附属在
      # Modrinth 上还没有项目。要加的时候：建好项目，填 MODRINTH_ID 变量和
      # MODRINTH_TOKEN 密钥，再照上面 CurseForge 那两步的样子加一份即可
      # （creds 那步多判一个平台，publish 单独一步）。
      #
      # 【两个平台要分成两步，不要合成一个】：mc-publish 只往"id 与 token 都
      # 齐了"的平台发，合成一步也能跑，但那样一个平台没配好、或者一个平台挂了，
      # 另一个就一起发不出去。
      #
      # Modrinth 那边依赖可以让它从 jar 自己读：查不到的依赖它 catch 住再
      # filter 掉，不会连累上传。这一点与 CurseForge 相反。
